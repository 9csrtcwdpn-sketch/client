<style>
:root{
  --bg:#ffffff;--bg2:#f7f7f8;--surface:#ffffff;--fg:#0d0d0d;--fg2:#5d5d5d;--mute:#8e8e93;
  --line:rgba(0,0,0,.08);--card:#f4f4f4;--user-bg:#f4f4f4;--user-fg:#0d0d0d;
  --black:#0d0d0d;--black-fg:#ffffff;--blue:#007aff;--blue-bg:#eaf3ff;--amber:#f59e0b;
  --bad:#d93025;--bad-bg:#fff1f0;--bad-line:#ffccc7;--ok:#16a34a;
  --glass:rgba(255,255,255,.8);--glass-strong:rgba(252,252,254,.94);--glass-line:rgba(255,255,255,.75);--glass-border:rgba(0,0,0,.09);
  --shadow:0 8px 30px rgba(0,0,0,.09);--shadow-sm:0 2px 12px rgba(0,0,0,.06);
  --code-bg:#f7f7f8;--track:#ececee;--dot:rgba(0,0,0,.2);--dot-on:rgba(255,255,255,.32);
  --col-max:820px
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d0d0d;--bg2:#171717;--surface:#1c1c1e;--fg:#f5f5f5;--fg2:#b4b4b4;--mute:#8e8e93;
  --line:rgba(255,255,255,.1);--card:#212121;--user-bg:#2a2a2d;--user-fg:#f5f5f5;
  --black:#f5f5f5;--black-fg:#0d0d0d;--blue:#4da3ff;--blue-bg:#162944;--amber:#fbbf24;
  --bad:#ff6b6b;--bad-bg:#2c1616;--bad-line:#5c2626;--ok:#4ade80;
  --glass:rgba(30,30,34,.82);--glass-strong:rgba(32,32,36,.95);--glass-line:rgba(255,255,255,.14);--glass-border:rgba(255,255,255,.12);
  --shadow:0 10px 32px rgba(0,0,0,.5);--shadow-sm:0 2px 14px rgba(0,0,0,.38);
  --code-bg:#161618;--track:#2a2a2e;--dot:rgba(255,255,255,.22);--dot-on:rgba(0,0,0,.28)
}}
:root[data-theme=dark]{
  --bg:#0d0d0d;--bg2:#171717;--surface:#1c1c1e;--fg:#f5f5f5;--fg2:#b4b4b4;--mute:#8e8e93;
  --line:rgba(255,255,255,.1);--card:#212121;--user-bg:#2a2a2d;--user-fg:#f5f5f5;
  --black:#f5f5f5;--black-fg:#0d0d0d;--blue:#4da3ff;--blue-bg:#162944;--amber:#fbbf24;
  --bad:#ff6b6b;--bad-bg:#2c1616;--bad-line:#5c2626;--ok:#4ade80;
  --glass:rgba(30,30,34,.82);--glass-strong:rgba(32,32,36,.95);--glass-line:rgba(255,255,255,.14);--glass-border:rgba(255,255,255,.12);
  --shadow:0 10px 32px rgba(0,0,0,.5);--shadow-sm:0 2px 14px rgba(0,0,0,.38);
  --code-bg:#161618;--track:#2a2a2e;--dot:rgba(255,255,255,.22);--dot-on:rgba(0,0,0,.28)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  margin:0;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;
  background:var(--bg);color:var(--fg);
  font:15.5px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  position:fixed;top:0;left:0;right:0;width:100%;height:100%;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}

/* 桌面端细滚动条 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.25);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.45)}

#app{
  flex:1 1 auto;min-height:0;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;
  transition:transform .28s cubic-bezier(.22,1,.36,1),border-radius .28s
}
#app.shifted{transform:scale(.965) translateX(12px);border-radius:24px;overflow:hidden}
#app.drop-over::after{
  content:"松手添加文件到对话";position:absolute;inset:12px;z-index:40;
  border:2px dashed var(--blue);border-radius:20px;background:var(--glass-strong);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--blue);pointer-events:none
}

/* 顶部液态毛玻璃导航 */
header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 14px 8px;background:var(--bg);position:relative;flex:0 0 auto;z-index:10
}
.g-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--glass);border:1px solid var(--glass-border);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-line);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex:none;
  transition:transform .16s cubic-bezier(.22,1,.36,1),opacity .14s,background .14s
}
.g-btn:hover{background:var(--card)}
.g-btn:active{transform:scale(.9);opacity:.78}
.g-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.model-pill{
  display:inline-flex;align-items:center;gap:6px;max-width:58vw;
  padding:7px 14px;border-radius:21px;
  background:var(--glass);border:1px solid var(--glass-border);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-line);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  font-size:14px;font-weight:600;color:var(--fg);transition:transform .14s,background .14s
}
.model-pill:hover{background:var(--card)}
.model-pill:active{transform:scale(.96)}
.mp-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-arr{color:var(--mute);font-size:12px;flex:none}

.top-right{
  display:inline-flex;align-items:center;height:40px;padding:0 4px;border-radius:20px;
  background:var(--glass);border:1px solid var(--glass-border);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-line);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  flex:none
}
.top-right button{
  width:34px;height:34px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg);transition:transform .14s,background .14s
}
.top-right button:hover{background:var(--card)}
.top-right button:active{transform:scale(.9);background:var(--card)}
.top-right svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* 消息列表：严格位于 header 和 composer-wrap 之间，绝不溢出到输入框下面 */
#list{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:10px 16px 18px;position:relative;z-index:1;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain
}
.list-inner{max-width:var(--col-max);margin:0 auto;width:100%}
.empty{
  min-height:60%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;padding:12vh 8px 6vh;animation:fadeUp .28s cubic-bezier(.22,1,.36,1)
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.4px;color:var(--fg)}
.empty p{margin:0;font-size:13.5px;color:var(--mute);max-width:300px}
.empty-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px;max-width:380px}
.ep{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--fg2);font-size:13.5px;font-weight:500;box-shadow:var(--shadow-sm);transition:transform .12s,background .14s}
.ep:hover{background:var(--card)}
.ep:active{transform:scale(.95);background:var(--card)}

#toBot{
  position:absolute;right:16px;bottom:calc(112px + env(safe-area-inset-bottom));z-index:8;
  width:36px;height:36px;border-radius:50%;
  background:var(--glass-strong);border:1px solid var(--glass-border);box-shadow:var(--shadow-sm);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:center;color:var(--fg);
  opacity:0;pointer-events:none;transform:translateY(8px) scale(.9);
  transition:opacity .2s,transform .2s cubic-bezier(.22,1,.36,1)
}
#toBot.on{opacity:1;pointer-events:auto;transform:none}

.u-wrap{display:flex;justify-content:flex-end;margin:0 0 18px;animation:fadeUp .18s ease-out}
.u{
  max-width:84%;background:var(--user-bg);color:var(--user-fg);
  padding:10px 16px;border-radius:22px;
  white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.55
}
.u img{display:block;max-width:min(62vw,320px);max-height:220px;border-radius:14px;margin-bottom:6px}
.fc{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:10px;font-size:13px;color:var(--fg2);margin:0 4px 6px 0}

.a{margin:0 0 22px;max-width:100%}
.th{margin:0 0 8px}
.th-btn{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);padding:4px 0;font-size:14px;font-weight:500}
.th-dot{width:7px;height:7px;border-radius:50%;background:var(--fg);flex:none;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.th-arr{font-size:12px;color:var(--mute);transition:transform .2s cubic-bezier(.22,1,.36,1)}
.th-btn.open .th-arr{transform:rotate(90deg)}
.tk{
  margin:6px 0 8px;padding:10px 12px;
  background:var(--bg2);border-left:2px solid var(--line);border-radius:0 12px 12px 0;
  color:var(--fg2);font-size:13.5px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;
  max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain
}

/* 联网搜索结果折叠卡 */
.web-box{margin:0 0 8px}
.web-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:12px;background:var(--blue-bg);color:var(--blue);font-size:12.5px;font-weight:500}
.web-list{display:none;margin-top:6px;padding:8px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px}
.web-box.open .web-list{display:block}
.web-item{display:block;padding:4px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.web-item:last-child{border-bottom:0}
.web-item strong{color:var(--blue);font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.web-item span{color:var(--mute);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.t{word-break:break-word;font-size:15.5px;line-height:1.72;color:var(--fg)}
.t p{margin:0 0 11px}.t p:last-child{margin-bottom:0}
.t h1,.t h2,.t h3,.t h4{margin:16px 0 6px;font-weight:600;line-height:1.35}
.t h1{font-size:19px}.t h2{font-size:17px}.t h3{font-size:16px}
.t ul,.t ol{margin:6px 0 11px;padding-left:20px}.t li{margin:4px 0}
.t blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--line);color:var(--fg2)}
.t a{color:var(--blue);text-decoration:none}.t a:hover{text-decoration:underline}
.t code{font:13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code-bg);padding:1.5px 5px;border-radius:5px}
.tbl-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px}
.t table{width:100%;border-collapse:collapse;font-size:13.5px}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.t th{background:var(--bg2);font-weight:600}
.t tr:last-child td{border-bottom:0}

.file-card{margin:10px 0;border:1px solid var(--line);border-radius:16px;background:var(--bg2);overflow:hidden}
.file-head{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.file-ico{
  width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;color:var(--fg);flex:none
}
.file-info{flex:1;min-width:0}
.file-name{font-size:14px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:12px;color:var(--mute);margin-top:1px}
.file-arr{font-size:12px;color:var(--mute);transition:transform .2s cubic-bezier(.22,1,.36,1);padding:0 4px}
.file-card.open .file-arr{transform:rotate(90deg)}
.file-bar{display:flex;align-items:center;gap:6px;padding:0 12px 11px;flex-wrap:wrap}
.fbtn{padding:5.5px 11px;border-radius:10px;font-size:12.5px;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.fbtn.pri{background:var(--black);color:var(--black-fg);border-color:var(--black)}
.fbtn:active{transform:scale(.95);opacity:.8}
.file-src{display:none;border-top:1px solid var(--line);background:var(--code-bg)}
.file-card.open .file-src{display:block}
.file-src pre{margin:0;padding:10px 12px;overflow:auto;font-size:12.5px;line-height:1.55;max-height:44vh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.file-src pre code{padding:0;background:none;font-size:12.5px}

.typing{display:inline-flex;gap:4px;padding:6px 2px;align-items:center}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:pulse 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
.err-box{margin-top:6px;padding:10px 13px;border-radius:14px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);font-size:13.5px;line-height:1.5}
.cut{color:var(--bad);font-size:12.5px;margin-top:6px}
.acts{display:flex;align-items:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12.5px;color:var(--mute);transition:background .12s,color .12s}
.act:hover,.act:active{background:var(--card);color:var(--fg)}
.act.speaking{color:var(--blue);background:var(--blue-bg)}
.det{margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px}
.det div{display:flex;justify-content:space-between;gap:14px;padding:3px 0}
.det span:first-child{color:var(--mute);flex:none}
.det span:last-child{text-align:right;word-break:break-all;color:var(--fg2)}
.det .det-hr{height:1px;background:var(--line);padding:0;margin:5px 0}
.ok{color:var(--ok)!important;font-weight:600}.diff{color:var(--bad)!important}

/* 底部两行圆角输入框：flex:0 0 auto 严格锁在底部，绝不与上方列表重叠 */
.composer-wrap{
  flex:0 0 auto;padding:4px 12px calc(8px + env(safe-area-inset-bottom));
  background:var(--bg);position:relative;z-index:10;border-top:1px solid transparent
}
.composer-inner{max-width:var(--col-max);margin:0 auto;width:100%}
body.kb-open .composer-wrap{padding-bottom:8px}
#atts{display:none;gap:8px;padding:0 2px 8px;overflow-x:auto}
.ch{position:relative;flex:none}
.ch img{width:54px;height:54px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line)}
.ch span{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)}
.ch button{position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:10px;background:var(--black);color:var(--black-fg);font-size:10px;display:flex;align-items:center;justify-content:center}

.composer-card{
  background:var(--surface);border:1px solid var(--glass-border);
  border-radius:26px;padding:10px 12px 8px 14px;
  box-shadow:0 4px 22px rgba(0,0,0,.07),inset 0 1px 0 var(--glass-line);
  display:flex;flex-direction:column;gap:6px;
  transition:border-color .18s,box-shadow .18s
}
.composer-card:focus-within{border-color:rgba(0,0,0,.2);box-shadow:0 6px 26px rgba(0,0,0,.1)}
.ta-row{display:flex;align-items:flex-start;gap:4px}
#ta{
  flex:1;width:100%;resize:none;min-height:26px;max-height:34vh;border:0;
  background:transparent;color:var(--fg);padding:2px 2px;
  font-family:inherit;font-size:16px;line-height:1.48;outline:none;
  overflow-y:auto;-webkit-overflow-scrolling:touch
}
#ta::placeholder{color:var(--mute)}
#taExpand{
  width:28px;height:28px;border-radius:8px;color:var(--mute);
  display:none;align-items:center;justify-content:center;flex:none
}
#taExpand.show{display:inline-flex}
#taExpand svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer-card.tall #ta{min-height:30vh;max-height:48vh}

.c-bar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:2px}
.c-left,.c-right{display:flex;align-items:center;gap:4px}
.c-ico{
  width:36px;height:36px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg);
  position:relative;transition:transform .13s,background .13s,color .13s
}
.c-ico:hover{background:var(--card)}
.c-ico:active{transform:scale(.88);background:var(--card)}
.c-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.c-ico.web-on{color:var(--blue);background:var(--blue-bg)}
.c-ico.bolt-on{color:var(--amber)}
.c-ico.rec{color:var(--bad);background:var(--bad-bg)}
.c-pill{
  height:34px;padding:0 11px;border-radius:17px;gap:5px;width:auto;font-size:12.5px;font-weight:500;color:var(--fg2);
  border:1px solid var(--line);background:var(--bg2)
}
.c-pill.web-on{color:var(--blue);background:var(--blue-bg);border-color:rgba(0,122,255,.25)}
.c-pill svg{width:16px;height:16px}
.dial-badge{
  position:absolute;bottom:2px;right:1px;min-width:16px;height:14px;padding:0 3px;border-radius:7px;
  background:var(--black);color:var(--black-fg);font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:none
}
#send{
  width:36px;height:36px;border-radius:50%;
  background:var(--black);color:var(--black-fg);
  font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none;
  transition:transform .13s,opacity .13s
}
#send:active{transform:scale(.9);opacity:.8}

/* 左侧抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(82vw,316px);
  background:var(--bg);z-index:21;display:flex;flex-direction:column;
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.22,1,.36,1);
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
  box-shadow:10px 0 36px rgba(0,0,0,.14)
}
.drawer.on{transform:none}
.d-top{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px}
.d-brand{font-size:18px;font-weight:700;letter-spacing:-.3px;padding-left:6px;display:inline-flex;align-items:center;gap:8px}
.d-brand img{width:24px;height:24px;border-radius:6px;display:block}
.d-search-wrap{display:none;margin:0 0 10px}
.d-search-wrap.on{display:block}
.d-search-wrap input{width:100%;padding:9px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);outline:none;font-size:14.5px}
.d-nav{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.d-item{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;font-size:15px;font-weight:500;color:var(--fg);text-align:left;transition:background .12s}
.d-item:hover,.d-item:active{background:var(--card)}
.d-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none}
.d-item .badge{margin-left:auto;font-size:12px;color:var(--mute)}
.d-list{flex:1;overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
.d-sec{font-size:12px;font-weight:600;color:var(--mute);padding:8px 10px 4px}
.d-hr{height:1px;background:var(--line);margin:8px 10px}
.cv{display:flex;align-items:center;gap:2px;margin:2px 0;border-radius:12px}
.cv .opt{flex:1;text-align:left;padding:10px 10px;border-radius:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;color:var(--fg);transition:background .12s}
.cv .opt:hover{background:var(--bg2)}
.cv .opt.on{background:var(--card);font-weight:600}
.cv .more-cv{width:34px;height:36px;border-radius:10px;color:var(--mute);display:flex;align-items:center;justify-content:center;flex:none}
.cv .more-cv:hover,.cv .more-cv:active{background:var(--card);color:var(--fg)}
.d-foot{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.new-pill{flex:1;height:44px;border-radius:22px;background:var(--black);color:var(--black-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;transition:transform .14s}
.new-pill:active{transform:scale(.97)}
.new-pill svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.u-av-btn{width:44px;height:44px;border-radius:50%;padding:2px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.u-av-in{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#2b2b2f,#52525b);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}

/* 全屏模态页（设置 z:28，接口 z:30） */
.full-modal{
  position:fixed;inset:0;background:var(--bg2);z-index:28;
  display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)
}
.full-modal.on{display:flex;animation:slideUp .24s cubic-bezier(.22,1,.36,1)}
@keyframes slideUp{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.fm-top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 10px;flex:none;max-width:720px;width:100%;margin:0 auto}
.fm-title{font-size:17px;font-weight:600}
.fm-body{flex:1;overflow-y:auto;padding:6px 16px 28px;-webkit-overflow-scrolling:touch;max-width:720px;width:100%;margin:0 auto}
.set-group{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.set-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;text-align:left;border-bottom:1px solid var(--line);transition:background .12s}
.set-row:last-child{border-bottom:0}
.set-row:hover,.set-row:active{background:var(--bg2)}
.set-row svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;color:var(--fg);flex:none}
.sr-t{font-size:15px;color:var(--fg)}
.sr-d{font-size:12.5px;color:var(--mute);margin-top:1px}
.sr-v{margin-left:auto;font-size:14px;color:var(--mute);display:inline-flex;align-items:center;gap:4px;flex:none}

/* 底部动作面板（z:32 高于全屏设置页） */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:32}
.sheet.on{display:flex}
.panel{
  background:var(--surface);width:100%;max-width:560px;max-height:86vh;overflow-y:auto;
  border-radius:24px 24px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 32px rgba(0,0,0,.14);animation:sheetUp .22s cubic-bezier(.22,1,.36,1)
}
@media(min-width:769px){
  .sheet{align-items:center;padding:20px}
  .panel{border-radius:22px;padding:18px 20px}
}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.panel-bar{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.panel h3{margin:0 0 12px;font-size:16.5px;font-weight:600;text-align:center}
.plus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pg-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 8px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--fg)}
.pg-tile:active{transform:scale(.96);background:var(--card)}
.pg-tile svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}

/* 悬浮 4 档思考滑块 + 参数面板（z:33） */
.effort-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.18);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:33
}
.effort-mask.on{display:flex;animation:popIn .18s cubic-bezier(.22,1,.36,1)}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.effort-box{
  width:min(92vw,370px);padding:20px 18px 16px;border-radius:28px;
  background:var(--glass-strong);border:1px solid var(--glass-border);
  box-shadow:0 18px 50px rgba(0,0,0,.18),inset 0 1px 0 var(--glass-line);
  backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%)
}
.effort-head{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:16px;
  font-size:18px;font-weight:600;letter-spacing:-.2px;cursor:pointer;width:100%
}
.effort-head .eh-lv{color:var(--mute);font-weight:500}
.effort-head .eh-arr{color:var(--mute);font-size:16px}
.slider-shell{
  position:relative;height:66px;border-radius:33px;padding:9px;
  background:var(--glass-strong);border:1px solid var(--glass-border);
  box-shadow:var(--shadow-sm),inset 0 1px 1px var(--glass-line);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer
}
.slider-track{position:relative;width:100%;height:100%;border-radius:24px;background:var(--track);overflow:hidden}
.slider-fill{
  position:absolute;top:0;left:0;bottom:0;border-radius:24px;background:var(--black);
  transition:width .16s cubic-bezier(.22,1,.36,1)
}
.slider-dots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center;pointer-events:none}
.slider-dot{width:8px;height:8px;border-radius:50%;background:var(--dot);transition:opacity .15s,background .15s}
.slider-dot.passed{background:var(--dot-on)}
.slider-dot.cur{opacity:0}
.slider-knob{
  position:absolute;top:0;width:48px;height:48px;border-radius:50%;
  background:#ffffff;box-shadow:0 2px 10px rgba(0,0,0,.22);pointer-events:none;
  transition:left .16s cubic-bezier(.22,1,.36,1),transform .12s
}
.slider-shell.dragging .slider-fill,.slider-shell.dragging .slider-knob{transition:none}
.slider-shell.dragging .slider-knob{transform:scale(1.06)}
.effort-ticks{display:grid;grid-template-columns:repeat(4,1fr);margin-top:9px;text-align:center;font-size:12px;color:var(--mute)}
.effort-ticks span{padding:2px 0;cursor:pointer;transition:color .14s}
.effort-ticks span.on{color:var(--fg);font-weight:600}
.effort-note{margin-top:8px;font-size:11.5px;color:var(--mute);line-height:1.45;text-align:center}
.adv-card{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.adv-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 13px;font-size:13.5px;border-bottom:1px solid var(--line);text-align:left}
.adv-row:last-child{border-bottom:0}
.adv-row span:last-child{color:var(--mute);font-size:13px}

/* 浮动毛玻璃模型选择菜单（z:36） */
.pop-mask{position:fixed;inset:0;background:rgba(0,0,0,.18);display:none;align-items:center;justify-content:center;padding:24px;z-index:36}
.pop-mask.on{display:flex}
.pop-card{
  width:min(88vw,320px);max-height:70vh;overflow-y:auto;
  background:var(--glass-strong);border:1px solid var(--glass-border);
  border-radius:22px;padding:8px 0;box-shadow:var(--shadow);
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  animation:popIn .18s cubic-bezier(.22,1,.36,1)
}
.pop-grp{padding:8px 16px 4px;font-size:12px;font-weight:600;color:var(--mute)}
.pop-opt{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;text-align:left;font-size:15px;color:var(--fg)}
.pop-opt:hover,.pop-opt:active{background:var(--card)}
.pop-opt .ck{width:18px;font-weight:700;color:var(--fg);flex:none}
.pop-opt .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-hr{height:1px;background:var(--line);margin:4px 0}

/* 表单卡片 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
label{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 4px}
label:first-child{margin-top:0}
.card input,.card select,.card textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:9px 11px;
  background:var(--bg2);color:var(--fg);outline:none;font-size:14.5px
}
.card input:focus,.card textarea:focus,.card select:focus{border-color:var(--fg2)}
.card textarea{min-height:78px;resize:vertical}
.mono{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:8px;margin-top:10px}
.row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{flex:1;padding:10px 12px;border-radius:12px;background:var(--card);color:var(--fg);font-size:14px;font-weight:500;text-align:center}
.btn.p{background:var(--black);color:var(--black-fg)}
.btn.d{color:var(--bad);background:var(--bad-bg)}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw-t{font-size:14.5px;font-weight:500}.sw-d{font-size:12px;color:var(--mute);margin-top:1px}
.sw{width:46px;height:27px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.22);transition:transform .2s}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(19px)}
.mem-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:12px;background:var(--bg2);margin-bottom:8px;font-size:13.5px}
.mem-item button{color:var(--bad);font-size:13px;padding:4px 8px;flex:none}
.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.preset-btn{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);text-align:left;font-size:13.5px;font-weight:500}
.preset-btn small{display:block;font-size:11.5px;color:var(--mute);font-weight:400;margin-top:2px}
.preset-btn:hover,.preset-btn:active{background:var(--card)}

/* HTML 预览 */
.prev-modal{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.prev-modal.on{display:flex}
.prev-top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line)}
.prev-modal iframe{flex:1;border:0;width:100%;background:#fff}

#toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%) translateY(-6px);
  background:var(--black);color:var(--black-fg);padding:8px 16px;border-radius:20px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:88%;text-align:center;box-shadow:var(--shadow)
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<div id="app">
  <header>
    <button class="g-btn" id="hist" title="菜单" aria-label="菜单">
      <svg viewBox="0 0 24 24"><line x1="5" y1="9" x2="19" y2="9"/><line x1="5" y1="15" x2="14" y2="15"/></svg>
    </button>
    <button class="model-pill" id="topModelBtn" title="切换模型与参数">
      <span class="mp-name" id="topModelName">Client</span>
      <span class="mp-arr">▾</span>
    </button>
    <div class="top-right">
      <button id="new" title="新对话" aria-label="新对话">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button id="chatMore" title="更多" aria-label="更多">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div id="list"><div class="list-inner" id="listIn"></div></div>
  <button id="toBot" aria-label="回到底部">↓</button>

  <div class="composer-wrap">
    <div class="composer-inner">
      <div id="atts"></div>
      <div class="composer-card" id="composerCard">
        <div class="ta-row">
          <textarea id="ta" rows="1" placeholder="有问题，尽管问"></textarea>
          <button id="taExpand" title="展开/收起输入框" aria-label="展开输入框">
            <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
        </div>
        <div class="c-bar">
          <div class="c-left">
            <button class="c-ico" id="plusBtn" title="添加照片或文件" aria-label="添加">
              <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button class="c-ico c-pill" id="webBtn" title="开关联网搜索" aria-label="联网搜索">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a15 15 0 0 1 4 9 15 15 0 0 1-4 9 15 15 0 0 1-4-9 15 15 0 0 1 4-9z"/></svg>
              <span>联网</span>
            </button>
          </div>
          <div class="c-right">
            <button class="c-ico" id="boltBtn" title="小闪电：切换深度思考/快速直出" aria-label="思考开关">
              <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="c-ico" id="effortTrigger" title="模型与思考深度" aria-label="思考深度">
              <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 3a9 9 0 0 1 6.36 2.64"/><line x1="12" y1="12" x2="16.5" y2="7.5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
              <span class="dial-badge" id="dialBadge">高</span>
            </button>
            <button class="c-ico" id="micBtn" title="语音输入" aria-label="语音输入">
              <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="9" y1="21" x2="15" y2="21"/></svg>
            </button>
            <button id="send" aria-label="发送">↑</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileImg" multiple hidden accept="image/*">
<input type="file" id="fileCam" hidden accept="image/*" capture="environment">
<input type="file" id="fileDoc" multiple hidden accept="application/pdf,.pdf,.docx,.txt,.md,.csv,.json,.js,.ts,.py,.html,.htm,.css,.xml,.log,.yaml,.yml,.java,.c,.cpp,.go,.rs,.sh,.sql,.ini,.toml,image/*">

/* ---- iOS Safari & Windows 双端视口严格锁死：彻底解决键盘弹出后内容跑到输入框下面的问题 ---- */

    }
  }else{
    document.body.style.height='100%';

    document.body.classList.remove('kb-open');
  }
}

{

/* ---- 时间格式化 & DeepSeek 官方时段费用 + 缓存省费精确计算 ---- */
function fmtTime(ts){
  const d=new Date(ts||Date.now());
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function isDeepSeekPeak(ts){
  /* 北京时间 UTC+8：周一至周五 09:00-12:00、14:00-18:00 为高峰（2倍），其余时间及周末为非高峰 */
  const bj=new Date((ts||Date.now())+8*3600*1000);
  const day=bj.getUTCDay();
  if(day===0||day===6)return false;
  const h=bj.getUTCHours();
  return (h>=9&&h<12)||(h>=14&&h<18);
}
function getPricing(model,ts){
  const fx=Number(cfg.fxRate)||7.2;
  if(cfg.priceCustom&&(cfg.priceMiss>0||cfg.priceOut>0)){
    return{miss:+cfg.priceMiss||0,hit:+cfg.priceHit||0,out:+cfg.priceOut||0,tag:'自定义费率'};
  }
  const m=(model||'').toLowerCase();
  const peak=isDeepSeekPeak(ts);
  const mult=peak?2:1;
  if(m.includes('deepseek')&&(m.includes('flash')||m.includes('chat'))){
    /* DeepSeek Flash 官方：非高峰 命中 $0.003 / 未命中 $0.15 / 输出 $0.60（每百万） */
    return{miss:0.15*mult*fx,hit:0.003*mult*fx,out:0.60*mult*fx,tag:peak?'官方高峰':'官方非高峰'};
  }
  if(m.includes('deepseek')||m.includes('v4-pro')||m.includes('reasoner')){
    /* DeepSeek V4-Pro 官方：非高峰 命中 $0.022 / 未命中 $0.66 / 输出 $1.98（每百万） */
    return{miss:0.66*mult*fx,hit:0.022*mult*fx,out:1.98*mult*fx,tag:peak?'官方高峰':'官方非高峰'};
  }
  return null;
}
function calcCost(meta){
  if(!meta||!meta.u||(meta.u.i==null&&meta.u.o==null))return null;
  const pr=getPricing(meta.rm&&!meta.rm.startsWith('（')?meta.rm:meta.req,meta.ts);
  if(!pr)return null;
  const totIn=Number(meta.u.i)||0,totOut=Number(meta.u.o)||0;
  const hit=meta.u.ch!=null?Math.min(totIn,Number(meta.u.ch)||0):0;
  const miss=Math.max(0,totIn-hit);
  const actual=(miss*pr.miss+hit*pr.hit+totOut*pr.out)/1e6;
  const orig=(totIn*pr.miss+totOut*pr.out)/1e6;
  const saved=Math.max(0,orig-actual);
  const savePct=orig>0?(saved/orig*100):0;
  return{actual,orig,saved,savePct,tag:pr.tag,hasCache:meta.u.ch!=null};
}
const fmtYuan=v=>v<0.0001?'¥0.0000':('¥'+v.toFixed(v<0.1?4:3));

/* ---- 联网搜索模块（支持免费内置免 Key 搜索 + Tavily / Bocha / Serper / SearXNG 实时全网搜索） ---- */
async function runWebSearch(query){
  const q=(query||'').trim().slice(0,220);
  if(!q)return{items:[],note:''};
  const prov=cfg.webProvider||'auto',key=(cfg.webKey||'').trim();
  try{
    if((prov==='tavily'||(prov==='auto'&&key&&key.startsWith('tvly-')))&&key){
      const r=await fetch('https://api.tavily.com/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({api_key:key,query:q,max_results:5,include_answer:true})});
      const j=await r.json();
      if(!r.ok)throw new Error(j.detail||j.error||'Tavily HTTP '+r.status);
      const items=(j.results||[]).map(x=>({title:x.title||x.url,url:x.url,snippet:x.content||''}));
      return{items,note:'Tavily 实时搜索'};
    }
    if(prov==='bocha'&&key){
      const r=await fetch('https://api.bochaai.com/v1/web-search',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+key},body:JSON.stringify({query:q,count:5,summary:true})});
      const j=await r.json();
      if(!r.ok)throw new Error(j.msg||'博查 HTTP '+r.status);
      const arr=j.data?.webPages?.value||[];
      return{items:arr.map(x=>({title:x.name||x.url,url:x.url,snippet:x.summary||x.snippet||''})),note:'博查实时搜索'};
    }
    if(prov==='serper'&&key){
      const r=await fetch('https://google.serper.dev/search',{method:'POST',headers:{'content-type':'application/json','X-API-KEY':key},body:JSON.stringify({q,num:5,hl:'zh-cn'})});
      const j=await r.json();
      if(!r.ok)throw new Error(j.message||'Serper HTTP '+r.status);
      return{items:(j.organic||[]).map(x=>({title:x.title||x.link,url:x.link,snippet:x.snippet||''})),note:'Serper 实时搜索'};
    }
    if(prov==='searxng'&&cfg.webUrl){
      const u=cfg.webUrl.replace(/\/+$/,'')+'/search?format=json&q='+encodeURIComponent(q);
      const r=await fetch(u);const j=await r.json();
      return{items:(j.results||[]).slice(0,5).map(x=>({title:x.title||x.url,url:x.url,snippet:x.content||''})),note:'SearXNG 搜索'};
    }
    /* 免 Key 免费兜底：优先中文维基百科 + DuckDuckGo Instant Answer（均支持浏览器直连 CORS） */
    const items=[];
    const isZh=/[\u4e00-\u9fa5]/.test(q);
    const wikiHost=isZh?'zh.wikipedia.org':'en.wikipedia.org';
    const [wk,ddg]=await Promise.allSettled([
      fetch('https://'+wikiHost+'/w/api.php?action=query&list=search&srlimit=4&format=json&origin=*&srsearch='+encodeURIComponent(q)).then(r=>r.json()),
      fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1&skip_disambig=1').then(r=>r.json())
    ]);
    if(ddg.status==='fulfilled'&&ddg.value){
      const d=ddg.value;
      if(d.AbstractText)items.push({title:d.Heading||q,url:d.AbstractURL||'https://duckduckgo.com/?q='+encodeURIComponent(q),snippet:d.AbstractText});
      for(const t of (d.RelatedTopics||[]).slice(0,2)){
        if(t.Text&&t.FirstURL)items.push({title:t.Text.slice(0,48),url:t.FirstURL,snippet:t.Text});
      }
    }
    if(wk.status==='fulfilled'&&wk.value?.query?.search){
      for(const s of wk.value.query.search.slice(0,3)){
        items.push({title:s.title,url:'https://'+wikiHost+'/wiki/'+encodeURIComponent(s.title),snippet:(s.snippet||'').replace(/<[^>]+>/g,'')});
      }
    }
    return{items:items.slice(0,5),note:items.length?'内置免 Key 搜索（填 Tavily Key 可全网实时搜）':'未命中免 Key 结果（建议在设置→联网搜索填免费 Tavily Key）'};
  }catch(err){
    return{items:[],note:'联网搜索失败：'+(err.message||err)};
  }
}

/* Markdown 渲染 + 文件卡片默认折叠 */
let codeStore=[];
const openCodeKeys=new Set();
function inlineMd(s){
  let h=esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  return h;
}
function renderCodeCard(info,code,mkey,idx){
  let lang=info,fname='';
  if(info.includes(':')){const sp=info.split(':');lang=sp[0].trim();fname=sp.slice(1).join(':').trim()}
  else if(info.includes('.')){fname=info;lang=info.split('.').pop().toLowerCase()}
  const ext=EXT_MAP[lang.toLowerCase()]||(lang?lang.toLowerCase().replace(/[^a-z0-9]/g,''):'txt')||'txt';
  const isHtml=ext==='html'||/^\s*<!doctype\s+html/i.test(code)||/^\s*<html/i.test(code);
  if(!fname)fname=isHtml?'index.html':('code.'+ext);
  const key=mkey+'_'+idx;
  const open=cfg.autoExpandCode||openCodeKeys.has(key);
  const storeId=codeStore.push({fname,code,isHtml,key})-1;
  const lines=code?code.split('\n').length:0;
  const tag=(ext||'FILE').toUpperCase().slice(0,4);
  return'<div class="file-card'+(open?' open':'')+'" data-fkey="'+esc(key)+'">'+
    '<div class="file-head" data-ftog="'+storeId+'">'+
      '<div class="file-ico">'+esc(tag)+'</div>'+
      '<div class="file-info"><div class="file-name">'+esc(fname)+'</div><div class="file-meta">'+fmtSize(code)+' · '+lines+' 行</div></div>'+
      '<span class="file-arr">▸</span>'+
    '</div>'+
    '<div class="file-bar">'+
      '<button class="fbtn pri" data-fdl="'+storeId+'">保存文件</button>'+
      (isHtml?'<button class="fbtn" data-fprev="'+storeId+'">预览</button>':'')+
      '<button class="fbtn" data-fcp="'+storeId+'">复制</button>'+

function renderBlocks(s,mkey){
  const lines=s.split('\n');let out=[],i=0;
  while(i<lines.length){
    const l=lines[i];
    if(!l.trim()){i++;continue}
    const hm=l.match(/^(#{1,4})\s+(.+)/);
    if(hm){out.push('<h'+hm[1].length+'>'+inlineMd(hm[2])+'</h'+hm[1].length+'>');i++;continue}
    if(/^\|.+\|$/.test(l.trim())&&i+1<lines.length&&/^\|[\s:|-]+\|$/.test(lines[i+1].trim())){
      let rows=[];while(i<lines.length&&/^\|.+\|$/.test(lines[i].trim())){rows.push(lines[i].trim().slice(1,-1).split('|').map(c=>c.trim()));i++}
      out.push('<div class="tbl-wrap"><table><thead><tr>'+rows[0].map(c=>'<th>'+inlineMd(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.slice(2).map(r=>'<tr>'+r.map(c=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue}
    if(/^\s*[-*•]\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*[-*•]\s+/.test(lines[i])){items.push('<li>'+inlineMd(lines[i].replace(/^\s*[-*•]\s+/,''))+'</li>');i++}out.push('<ul>'+items.join('')+'</ul>');continue}
    if(/^\s*\d+\.\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){items.push('<li>'+inlineMd(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>');i++}out.push('<ol>'+items.join('')+'</ol>');continue}
    if(/^>\s?/.test(l)){let q=[];while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(inlineMd(lines[i].replace(/^>\s?/,'')));i++}out.push('<blockquote>'+q.join('<br>')+'</blockquote>');continue}
    let p=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,4}\s|\s*[-*•]\s|\s*\d+\.\s|>\s?|\|.+\|$)/.test(lines[i])){p.push(inlineMd(lines[i]));i++}
    out.push('<p>'+p.join('<br>')+'</p>');
  }
  return out.join('');
}
function md(text,streaming,mkey){
  if(!text)return'';
  const parts=text.split(/(```[^\n]*\n?[\s\S]*?(?:```|$))/g);
  let cidx=0;
  return parts.map((p,idx)=>{
    if(idx%2===1){
      const m=p.match(/^```([^\n]*)\n?([\s\S]*?)(?:```)?$/);
      const info=(m?.[1]||'').trim(),code=(m?.[2]||'').replace(/\n$/,'');
      if(streaming)return'<div class="file-card"><div class="file-head"><div class="file-ico">CODE</div><div class="file-info"><div class="file-name">'+esc(info||'正在生成代码…')+'</div><div class="file-meta">已接收 '+fmtSize(code)+'（完成后可一键保存或展开）</div></div></div></div>';
      return renderCodeCard(info,code,mkey,cidx++);
    }
    return renderBlocks(p,mkey);
  }).join('');
}

async function extractDocxText(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const dv=new DataView(buf.buffer);
  let i=0;
  while(i+30<buf.length){
    if(dv.getUint32(i,true)!==0x04034b50)break;
    const comp=dv.getUint16(i+8,true),csz=dv.getUint32(i+18,true),nlen=dv.getUint16(i+26,true),elen=dv.getUint16(i+28,true);
    const name=new TextDecoder().decode(buf.subarray(i+30,i+30+nlen));
    const start=i+30+nlen+elen,end=start+csz;
    if(name==='word/document.xml'){
      let raw=buf.subarray(start,end);
      if(comp===8&&typeof DecompressionStream!=='undefined'){
        const ds=new DecompressionStream('deflate-raw');
        const w=ds.writable.getWriter();w.write(raw);w.close();
        raw=new Uint8Array(await new Response(ds.readable).arrayBuffer());
      }
      const xml=new TextDecoder().decode(raw);
      return xml.replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').trim();
    }
    i=end;if(csz===0)break;
  }
  throw new Error('未能解析该 Word 文件，请另存为 PDF 或 TXT');
}

async function readFile(f){
  if(f.size===0)throw new Error(f.name+' 是空文件');
  if(f.size>20e6)throw new Error(f.name+' 太大（上限约 20MB）');
  if(f.type.startsWith('image/')||/\.(png|jpe?g|webp|gif|bmp|heic|heif)$/i.test(f.name)){
    try{return{kind:'image',name:f.name,data:await shrink(f)}}
    catch{return{kind:'image',name:f.name,data:await toURL(f,f.type||'image/jpeg')}}}
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))return{kind:'pdf',name:f.name,data:await toURL(f,'application/pdf')};
  if(/\.docx$/i.test(f.name)){const t=await extractDocxText(f);return{kind:'text',name:f.name,text:t.slice(0,200000)}}
  if(f.type.startsWith('text/')||f.type==='application/json'||/\.(txt|md|csv|json|js|ts|py|html|htm|css|xml|log|ya?ml|java|c|cpp|go|rs|sh|sql|ini|toml)$/i.test(f.name)){

  }
  throw new Error('暂不支持这种文件：'+f.name)}

function clean(src){
  let out=[];
  for(const m of src){
    if(m.streaming)continue;
    if(m.role==='assistant'&&m.err)continue;
    const txt=typeof m.text==='string'?m.text:'';
    if(!txt.trim()&&!(m.atts||[]).length)continue;
    const l=out[out.length-1];
    if(l&&l.role===m.role){
      if(m.role==='user'&&l.text.trim()&&l.text.trim()===txt.trim()&&!(m.atts&&m.atts.length))continue;
      l.text=(l.text&&txt?l.text+'\n\n':l.text)+txt;
      l.atts=[...(l.atts||[]),...(m.atts||[])]}
    else out.push({role:m.role,text:txt,atts:m.atts?[...m.atts]:undefined})}
  while(out.length&&out[0].role!=='user')out.shift();
  if(!cfg.ctxOn){const lastU=[...out].reverse().find(x=>x.role==='user');return lastU?[lastU]:[]}
  const maxMsgs=(cfg.ctxTurns||30)*2+1;
  if(out.length>maxMsgs){out=out.slice(-maxMsgs);while(out.length&&out[0].role!=='user')out.shift()}
  return out}

const root=(b,t)=>{b=b.trim().replace(/\/+$/,'');return(t==='anthropic'||t==='gemini')?b.replace(/\/v1(beta)?$/,''):b};
const oaiBase=b=>{b=b.trim().replace(/\/+$/,'');try{const u=new URL(b);return u.pathname==='/'||u.pathname===''?b+'/v1':b}catch{return b}};
const errText=(j,raw)=>{const e=j&&(j.error?.message||j.error||j.message);return typeof e==='string'?e:raw.slice(0,200)};
function friendlyErr(e){
  const msg=String(e?.message||e||'未知错误');
  if(/load failed|failed to fetch|networkerror|network connection was lost|the internet connection appears to be offline/i.test(msg))
    return'网络连接中断（接口响应超时、文件过大，或手机切到了后台）';
  return msg}
async function http(url,opt){
  let r;try{r=await fetch(url,opt)}catch(e){throw new Error('网络请求失败：请检查接口地址、网络，或确认该服务支持浏览器直连')}
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch{}
  if(!r.ok)throw new Error('HTTP '+r.status+'：'+errText(j,txt));
  if(!j)throw new Error('返回内容不是 JSON：'+txt.slice(0,120));
  return j}
async function sse(url,opt,onEv){
  let r;try{r=await fetch(url,opt)}catch(e){if(e.name==='AbortError')throw e;throw new Error(friendlyErr(e))}
  if(!r.ok){const t=await r.text();let j;try{j=JSON.parse(t)}catch{}const err=new Error('HTTP '+r.status+'：'+errText(j,t));err.status=r.status;throw err}
  const eat=l=>{l=l.replace(/\r$/,'');if(!l.startsWith('data:'))return;const d=l.slice(5).trim();if(!d||d==='[DONE]')return;let j;try{j=JSON.parse(d)}catch{return}onEv(j)};
  if(!(r.headers.get('content-type')||'').includes('event-stream')){
    const t=await r.text();if(/^\s*(event:|data:)/m.test(t)){t.split('\n').forEach(eat);return}
    let j;try{j=JSON.parse(t)}catch{throw new Error('返回内容不是 JSON：'+t.slice(0,120))}
    if(Array.isArray(j))j.forEach(onEv);else onEv(j);return}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  try{
    for(;;){
      let res;try{res=await rd.read()}catch(e){if(e.name==='AbortError')throw e;throw new Error(friendlyErr(e))}
      if(res.done)break;
      buf+=dec.decode(res.value,{stream:true});
      let i;while((i=buf.indexOf('\n'))>=0){eat(buf.slice(0,i));buf=buf.slice(i+1)}
    }
    buf+=dec.decode();if(buf)buf.split('\n').forEach(eat)
  }finally{rd.cancel().catch(()=>{})}}

async function call(ch,model,hist,conv,webCtx,on,allowExtra=true){
  const t0=performance.now(),t=ch.type,H={'content-type':'application/json'};let text='',think='',rm='',u={},cut=false,url,reqBody;
  const sysPrompt=buildSystemPrompt(conv,webCtx),ef=curEff();
  const isDS=t==='deepseek'||/deepseek/i.test(model);
  const useExtra=allowExtra&&cfg.dsNativeParams&&!proxyNoExtra.has(ch.id);

  if(t==='anthropic'){
    url=root(ch.base,'anthropic')+'/v1/messages';
    Object.assign(H,{'x-api-key':ch.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'});
    reqBody={model,max_tokens:cfg.maxTokens||8192,stream:true,messages:hist.map(m=>({role:m.role,content:body(m,'anthropic')}))};
    if(sysPrompt)reqBody.system=sysPrompt;
  }else if(t==='gemini'){
    url=root(ch.base,'gemini')+'/v1beta/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse';
    H['x-goog-api-key']=ch.key;
    reqBody={contents:hist.map(m=>({role:m.role==='user'?'user':'model',parts:body(m,'gemini')}))};
    if(sysPrompt)reqBody.systemInstruction={parts:[{text:sysPrompt}]};
    if(cfg.webOn&&(!webCtx||!webCtx.length))reqBody.tools=[{google_search:{}}];
  }else{
    url=oaiBase(ch.base)+'/chat/completions';
    if(ch.key)H.authorization='Bearer '+ch.key;
    const ms=hist.map(m=>({role:m.role,content:body(m,'openai')}));
    if(sysPrompt)ms.unshift({role:'system',content:sysPrompt});
    reqBody={model,stream:true,stream_options:{include_usage:true},messages:ms};
    if(cfg.maxTokens>0)reqBody.max_tokens=cfg.maxTokens;
    if(useExtra&&isDS){
      reqBody.thinking={type:ef.think?'enabled':'disabled'};
      if(ef.think&&ef.api)reqBody.reasoning_effort=ef.api;
      else if(!ef.think&&typeof cfg.temp==='number')reqBody.temperature=cfg.temp;
    }else if(useExtra&&typeof cfg.temp==='number'&&cfg.temp!==1.0){
      reqBody.temperature=cfg.temp;
    }
  }
  try{
    await sse(url,{method:'POST',headers:H,signal:ctl.signal,body:JSON.stringify(reqBody)},j=>{
      if(j.error)throw new Error(typeof j.error==='string'?j.error:String(j.error.message||JSON.stringify(j.error)).slice(0,200));
      if(t==='anthropic'){
        if(j.type==='message_start'){rm=j.message?.model||rm;u.i=j.message?.usage?.input_tokens}
        else if(j.type==='content_block_delta'){const d=j.delta||{};if(d.type==='text_delta'&&d.text)text+=d.text;else if(d.type==='thinking_delta'&&d.thinking)think+=d.thinking}
        else if(j.type==='message_delta'){if(j.usage?.output_tokens!=null)u.o=j.usage.output_tokens;if(j.delta?.stop_reason==='max_tokens')cut=true}
        else if(j.type==='message'){rm=j.model||rm;u={i:j.usage?.input_tokens,o:j.usage?.output_tokens};if(j.stop_reason==='max_tokens')cut=true;for(const b of j.content||[]){if(b.type==='text'&&b.text)text+=b.text;else if(b.type==='thinking'&&b.thinking)think+=b.thinking}}
      }else if(t==='gemini'){
        const cand=j.candidates?.[0];
        for(const p of cand?.content?.parts||[]){if(p.thought)think+=p.text||'';else text+=p.text||''}
        if(cand?.finishReason==='MAX_TOKENS')cut=true;
        rm=j.modelVersion||rm;if(j.usageMetadata)u={i:j.usageMetadata.promptTokenCount,o:j.usageMetadata.candidatesTokenCount}
      }else{
        const c=j.choices?.[0],d=c?.delta||c?.message||{};
        text+=typeof d.content==='string'?d.content:(d.content||[]).map(p=>p.text||'').join('');
        const rk=d.reasoning_content||d.reasoning;if(typeof rk==='string')think+=rk;
        if(c?.finish_reason==='length')cut=true;
        rm=j.model||rm;
        if(j.usage){
          u={
            i:j.usage.prompt_tokens,
            o:j.usage.completion_tokens,
            ch:j.usage.prompt_cache_hit_tokens??j.usage.prompt_tokens_details?.cached_tokens??null,
            cm:j.usage.prompt_cache_miss_tokens??null
          };
        }
      }
      on(text,think)});
  }catch(err){
    if(allowExtra&&useExtra&&(err.status===400||err.status===422)&&!text&&!think){
      proxyNoExtra.add(ch.id);
      return await call(ch,model,hist,conv,webCtx,on,false);
    }
    throw err;
  }
  if(!text)throw new Error('模型没有返回文字内容');
  return{text,think,rm:rm||'（接口未返回）',u,cut,ms:Math.round(performance.now()-t0),ts:Date.now()}}

function same(a,b){a=a.toLowerCase().replace(/^models\//,'');b=b.toLowerCase().replace(/^models\//,'');if(a===b)return true;const[x,y]=a.length<b.length?[a,b]:[b,a];return y.startsWith(x+'-')&&/^(\d{4}-\d{2}-\d{2}|\d{8}|\d{4}|\d{3}|latest|preview.*)$/.test(y.slice(x.length+1))}
let softTimer=0;
function thinkLabelText(m){
  const wait=m.streaming&&!m.text;
  const open=m.to??cfg.autoExpandThink;
  const sec=m.t0?Math.max(1,Math.round((Date.now()-m.t0)/1000)):(m.thinkSec||0);
  return wait?('正在思考…'+(sec?' '+sec+'秒':'')):(open?'收起思考':'已思考 '+(m.thinkSec?m.thinkSec+' 秒':'完成'));
}
function msgHtml(m,i){
  if(m.role==='user')return'<div class="u-wrap"><div class="u" data-u="'+i+'">'+attHtml(m)+esc(m.text)+'</div></div>';
  const d=m.meta,wait=m.streaming&&!m.text,open=m.to??cfg.autoExpandThink;
  const rk=d?(d.rm.startsWith('（')?'':same(d.req,d.rm)?'ok':'diff'):'';
  const mkey=cid+'_'+i;
  let bodyHtml='';
  if(m.err){bodyHtml=(m.partial?'<div class="t">'+md(m.partial,false,mkey)+'</div>':'')+'<div class="err-box">'+esc(m.text)+'</div>'}
  else if(m.text){bodyHtml='<div class="t">'+md(m.text,m.streaming,mkey)+'</div>'}
  else if(m.streaming&&!m.think){bodyHtml='<div class="t"><div class="typing"><span></span><span></span><span></span></div></div>'}
  else{bodyHtml='<div class="t"></div>'}

  const webHtml=(m.web?.items?.length)?('<div class="web-box'+(m.webOpen?' open':'')+'" data-wb="'+i+'"><button class="web-btn" data-wt="'+i+'">🌐 已参考 '+m.web.items.length+' 条联网结果 ▸</button><div class="web-list">'+
    m.web.items.map(w=>'<a class="web-item" href="'+esc(w.url)+'" target="_blank" rel="noopener noreferrer"><strong>'+esc(w.title)+'</strong><span>'+esc(w.snippet)+'</span></a>').join('')+
    '</div></div>'):(m.web?.note?'<div class="web-box"><span class="web-btn" style="opacity:.8">🌐 '+esc(m.web.note)+'</span></div>':'');

  const acts=!m.streaming?('<div class="acts">'+
    (m.text&&!m.err?'<button class="act" data-c="'+i+'">复制</button><button class="act'+(speakIdx===i?' speaking':'')+'" data-sp="'+i+'">'+(speakIdx===i?'停止朗读':'朗读')+'</button><button class="act" data-save="'+i+'">存为文件</button>':'')+
    '<button class="act" data-re="'+i+'">重试</button>'+
    (m.err?'<button class="act" data-dm="'+i+'">删除</button>':'')+
    (d?'<button class="act" data-i="'+i+'">'+(m.open?'收起详情':'详情')+'</button>':'')+
    '</div>'):'';

  let det='';
  if(d&&m.open){
    const cost=calcCost(d);
    const cacheRow=(d.u&&d.u.ch!=null)?('<div><span>缓存命中</span><span class="ok">'+d.u.ch.toLocaleString()+' token'+(d.u.i?('（'+Math.round(d.u.ch/d.u.i*100)+'%）'):'')+'</span></div>'):'';
    const costRows=cost?(
      '<div class="det-hr"></div>'+
      '<div><span>本次实付（'+esc(cost.tag)+'）</span><span>'+fmtYuan(cost.actual)+'</span></div>'+
      '<div><span>无缓存原价（本来）</span><span>'+fmtYuan(cost.orig)+'</span></div>'+
      '<div><span>命中缓存省了</span><span class="ok">'+(cost.saved>0?('省 '+fmtYuan(cost.saved)+'（省 '+cost.savePct.toFixed(1)+'%）'):'¥0.0000（未命中）')+'</span></div>'
    ):'';
    det='<div class="det">'+
      '<div><span>时间</span><span>'+fmtTime(d.ts)+'</span></div>'+
      '<div><span>请求的模型</span><span>'+esc(d.req)+'</span></div>'+
      '<div><span>接口返回的模型</span><span class="'+rk+'">'+esc(d.rm)+(rk==='diff'?'（与请求不同）':'')+'</span></div>'+
      '<div><span>渠道 / 协议</span><span>'+esc(d.ch)+' · '+esc((TYPES[d.type]||d.type).split('（')[0])+'</span></div>'+
      '<div><span>耗时</span><span>'+(d.ms/1000).toFixed(1)+' 秒</span></div>'+
      '<div><span>Token</span><span>'+(d.u?.i!=null?d.u.i.toLocaleString():'-')+' 入 / '+(d.u?.o!=null?d.u.o.toLocaleString():'-')+' 出</span></div>'+
      cacheRow+costRows+'</div>';
  }
  return'<div class="a" data-idx="'+i+'">'+
    webHtml+
    '<div class="th" style="display:'+(m.think?'block':'none')+'">'+
      '<button class="th-btn'+(open?' open':'')+'" data-t="'+i+'">'+
        (wait?'<span class="th-dot"></span>':'')+
        '<span class="th-lbl">'+thinkLabelText(m)+'</span>'+
        '<span class="th-arr">▸</span>'+
      '</button>'+
      '<div class="tk" style="display:'+(open&&m.think?'block':'none')+'">'+(open&&m.think?esc(m.think):'')+'</div>'+
    '</div>'+
    bodyHtml+
    (d?.cut?'<div class="cut">输出达到长度上限，内容可能已截断</div>':'')+
    acts+det+'</div>'}

const soft=()=>{
  if(softTimer)return;
  softTimer=setTimeout(()=>{
    softTimer=0;
    const L=$('#list'),IN=$('#listIn'),i=msgs.length-1,m=msgs[i],e=IN.lastElementChild;
    if(!m||m.role!=='assistant'||!e||!e.classList.contains('a')){render();return}
    const near=L.scrollHeight-L.scrollTop-L.clientHeight<90;
    const th=e.querySelector('.th');
    if(m.think&&th){
      th.style.display='block';
      const lbl=th.querySelector('.th-lbl');if(lbl)lbl.textContent=thinkLabelText(m);
      const dot=th.querySelector('.th-dot');if(m.text&&dot)dot.remove();
      const tk=th.querySelector('.tk');
      const open=m.to??cfg.autoExpandThink;
      if(tk&&open){
        const atBot=tk.scrollHeight-tk.scrollTop-tk.clientHeight<36;
        tk.style.display='block';tk.textContent=m.think;
        if(atBot)tk.scrollTop=tk.scrollHeight;
      }
    }
    const tEl=e.querySelector('.t');
    if(tEl&&m.text)tEl.innerHTML=md(m.text,true,cid+'_'+i);
    if(near)L.scrollTop=L.scrollHeight;
  },100)};

async function runAssist(hist,s,targetConv){
  stopSpeak();
  busy=true;$('#send').textContent='■';ctl=new AbortController();
  const m={role:'assistant',text:'',think:'',streaming:true,t0:Date.now()};
  targetConv.msgs.push(m);save();render(true);
  try{
    let webRes=null;
    if(cfg.webOn){
      const lastUser=[...hist].reverse().find(x=>x.role==='user')?.text||'';
      if(lastUser){
        m.web={items:[],note:'正在联网搜索…'};render(true);
        webRes=await runWebSearch(lastUser);
        m.web=webRes;render(true);
      }
    }
    const r=await call(s.c,s.m,hist,targetConv,webRes?.items||[],(t,k)=>{
      if(k&&!t&&!m.thinkStart)m.thinkStart=Date.now();
      if(t&&m.thinkStart&&!m.thinkSec)m.thinkSec=Math.max(1,Math.round((Date.now()-m.thinkStart)/1000));
      m.text=t;m.think=k;soft();
    });
    if(m.thinkStart&&!m.thinkSec)m.thinkSec=Math.max(1,Math.round((Date.now()-m.thinkStart)/1000));
    delete m.t0;delete m.thinkStart;
    Object.assign(m,{text:r.text,think:r.think,streaming:false,meta:{req:s.m,rm:r.rm,ch:s.c.name,type:s.c.type,ms:r.ms,ts:r.ts,u:r.u,cut:r.cut}})
  }catch(e){
    delete m.t0;delete m.thinkStart;m.streaming=false;
    if(e.name==='AbortError'){if(!m.text){m.err=true;m.text='已停止生成'}}
    else{if(m.text)m.partial=m.text;m.err=true;m.text=friendlyErr(e)}
  }
  if(softTimer){clearTimeout(softTimer);softTimer=0}
  busy=false;$('#send').textContent='↑';save();render()
}
async function retryAt(idx){
  const s=cur();if(!s){toast('先选择模型');openModels();return}
  const cv=curConv();cv.msgs.splice(idx,1);
  const hist=clean(cv.msgs);
  if(!hist.length){toast('没有可重试的消息');render();return}
  await runAssist(hist,s,cv);
}
async function send(){
  const ta=$('#ta'),text=ta.value.trim();if((!text&&!att.length)||busy)return;
  const s=cur();if(!s){toast('先选择模型');openModels();return}
  const cv=curConv();
  cv.ts=Date.now();
  if(cv.title==='新对话')cv.title=(text||att[0]?.name||'新对话').replace(/\s+/g,' ').slice(0,22);
  cv.msgs.push({role:'user',text,ts:Date.now(),atts:att.length?att:undefined});
  att=[];drawAtts();ta.value='';$('#composerCard').classList.remove('tall');autoSizeTa();
  const hist=clean(cv.msgs);
  await runAssist(hist,s,cv);
}

function collectLibrary(){
  const items=[];
  for(const c of convs){
    for(const m of c.msgs){
      if(m.role!=='assistant'||!m.text)continue;
      const parts=m.text.split(/(```[^\n]*\n?[\s\S]*?(?:```|$))/g);
      for(let i=1;i<parts.length;i+=2){
        const mm=parts[i].match(/^```([^\n]*)\n?([\s\S]*?)(?:```)?$/);
        const info=(mm?.[1]||'').trim(),code=(mm?.[2]||'').replace(/\n$/,'');
        if(!code.trim())continue;
        let lang=info,fname='';
        if(info.includes(':')){const sp=info.split(':');lang=sp[0].trim();fname=sp.slice(1).join(':').trim()}
        else if(info.includes('.')){fname=info;lang=info.split('.').pop().toLowerCase()}
        const ext=EXT_MAP[lang.toLowerCase()]||'txt';
        const isHtml=ext==='html'||/^\s*<!doctype\s+html/i.test(code)||/^\s*<html/i.test(code);
        if(!fname)fname=isHtml?'index.html':('code.'+ext);
        items.push({fname,code,isHtml,convTitle:c.title});
      }
    }
  }
  return items;
}

  const items=collectLibrary();

}

function calcUsage(){
  let mCount=0,tokIn=0,tokOut=0,tokHit=0,totalAct=0,totalOrig=0;
  convs.forEach(c=>c.msgs.forEach(m=>{
    if(m.role==='assistant'&&!m.err){
      mCount++;tokIn+=m.meta?.u?.i||0;tokOut+=m.meta?.u?.o||0;tokHit+=m.meta?.u?.ch||0;
      const cs=calcCost(m.meta);
      if(cs){totalAct+=cs.actual;totalOrig+=cs.orig}
    }
  }));
  return{mCount,tokIn,tokOut,tokHit,totalAct,totalOrig,totalSaved:Math.max(0,totalOrig-totalAct)}}

    '<div class="preset-grid">'+PRESETS.map((p,i)=>'<button class="preset-btn" data-pre="'+i+'">'+esc(p.name)+'<small>'+esc(p.desc)+'</small></button>').join('')+'</div>'+
    '<div class="card">'+
      '<label>你的称呼</label><input id="pNick" value="'+esc(cfg.nick)+'" placeholder="例如：你的名字">'+
      '<label>回答风格</label><input id="pStyle" value="'+esc(cfg.style)+'" placeholder="例如：简洁直接、少废话">'+
      '<label>自定义指令（System Prompt）</label><textarea id="pSys" placeholder="写下希望 AI 遵守的规则…">'+esc(cfg.sys)+'</textarea>'+
    '</div>'+
    '<div class="card">'+
      '<div class="sw-row"><div><div class="sw-t">跨对话全局记忆</div><div class="sw-d">默认关闭，确保每个新对话完全独立不串台</div></div><button class="sw'+(cfg.memOn?' on':'')+'" id="swMem"></button></div>'+
      (cfg.memOn?('<label>添加全局记忆</label><div class="row" style="margin-top:4px"><input id="newMem" placeholder="输入想记住的信息…"><button class="btn p" id="addMem" style="flex:none">添加</button></div>'+
      (mems.length?'<div style="margin-top:10px">'+mems.map((x,i)=>'<div class="mem-item"><span>'+esc(x)+'</span><button data-dm="'+i+'">✕</button></div>').join('')+'</div>':'')):'')+
    '</div>'+
    '<div class="row"><button class="btn p" id="savePer">保存</button><button class="btn" id="closeMod">取消</button></div>';
  $('#smod').classList.add('on');
  P.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.pre];$('#pSys').value=p.sys;toast('已填入「'+p.name+'」，点保存生效')});
  $('#swMem').onclick=()=>{cfg.memOn=!cfg.memOn;save();openCustom()};
  if($('#addMem'))$('#addMem').onclick=()=>{const v=$('#newMem').value.trim();if(!v)return;mems.unshift(v);save();openCustom()};
  P.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{mems.splice(+b.dataset.dm,1);save();openCustom()});
  $('#savePer').onclick=()=>{cfg.nick=$('#pNick').value.trim();cfg.style=$('#pStyle').value.trim();cfg.sys=$('#pSys').value.trim();save();render();$('#smod').classList.remove('on');toast('已保存')};
  $('#closeMod').onclick=()=>$('#smod').classList.remove('on');
}

function openPrefs(){
  const P=$('#pmod');
  P.innerHTML='<div class="panel-bar"></div><h3>常规与参数设置</h3>'+
    '<div class="card">'+
      '<div class="sw-row"><div><div class="sw-t">对话上下文记忆</div><div class="sw-d">仅在当前对话框内连贯，新对话完全独立</div></div><button class="sw'+(cfg.ctxOn?' on':'')+'" id="swCtx"></button></div>'+
      '<label>当前对话携带轮数</label>'+
      '<select id="pTurns">'+[5,10,20,30,60].map(n=>'<option value="'+n+'"'+(cfg.ctxTurns===n?' selected':'')+'>最近 '+n+' 轮</option>').join('')+'</select>'+
      '<div class="sw-row" style="margin-top:8px"><div><div class="sw-t">启用 DeepSeek 原生控制参数</div><div class="sw-d">发送 thinking / reasoning_effort / temperature（中转不支持时自动降级）</div></div><button class="sw'+(cfg.dsNativeParams?' on':'')+'" id="swNative"></button></div>'+
      '<label>最大输出上限（max_tokens，0 为不限制）</label>'+
      '<select id="pMaxTok">'+[0,4096,8192,16384,32768].map(n=>'<option value="'+n+'"'+(cfg.maxTokens===n?' selected':'')+'>'+(n?n+' tokens':'默认不限制')+'</option>').join('')+'</select>'+
      '<div class="sw-row" style="margin-top:8px"><div><div class="sw-t">默认展开思考过程</div><div class="sw-d">关闭时默认折叠，点一下随时展开</div></div><button class="sw'+(cfg.autoExpandThink?' on':'')+'" id="swTk"></button></div>'+
      '<div class="sw-row"><div><div class="sw-t">默认展开代码块</div><div class="sw-d">关闭时折叠成文件卡片，随时可展开或保存</div></div><button class="sw'+(cfg.autoExpandCode?' on':'')+'" id="swCd"></button></div>'+
    '</div>'+
    '<div class="row"><button class="btn p" id="closeMod">完成</button></div>';
  $('#smod').classList.add('on');
  $('#swCtx').onclick=()=>{cfg.ctxOn=!cfg.ctxOn;save();openPrefs()};
  $('#swNative').onclick=()=>{cfg.dsNativeParams=!cfg.dsNativeParams;proxyNoExtra.clear();save();openPrefs()};
  $('#swTk').onclick=()=>{cfg.autoExpandThink=!cfg.autoExpandThink;save();openPrefs()};
  $('#swCd').onclick=()=>{cfg.autoExpandCode=!cfg.autoExpandCode;save();render();openPrefs()};
  $('#pTurns').onchange=e=>{cfg.ctxTurns=+e.target.value;save();openPrefs()};
  $('#pMaxTok').onchange=e=>{cfg.maxTokens=+e.target.value;save();openPrefs()};
  $('#closeMod').onclick=()=>{$('#smod').classList.remove('on');if($('#setModal').classList.contains('on'))openSettings()};
}
$('#smod').onclick=e=>{if(e.target.id==='smod')$('#smod').classList.remove('on')};

function openApiModal(){
  const P=$('#ps');
  P.innerHTML=channels.map(c=>'<div class="card" data-id="'+c.id+'"><label>名称</label><input data-k="name" value="'+esc(c.name)+'"><label>协议</label><select data-k="type">'+Object.entries(TYPES).map(([k,v])=>'<option value="'+k+'"'+(c.type===k?' selected':'')+'>'+v+'</option>').join('')+'</select><label>接口地址</label><input data-k="base" value="'+esc(c.base)+'" autocapitalize="off" autocorrect="off"><label>API Key</label><input data-k="key" type="password" value="'+esc(c.key)+'" autocapitalize="off" autocorrect="off"><label>模型（每行一个，可手动添加）</label><textarea class="mono" data-k="models" autocapitalize="off" autocorrect="off">'+esc(c.models.join('\n'))+'</textarea><div class="row"><button class="btn p" data-a="fetch">获取模型列表</button><button class="btn d" data-a="del">删除</button></div></div>').join('')+'<div class="row"><button class="btn p" data-a="add">添加接口</button></div>';
  $('#apiModal').classList.add('on')}
$('#apiClose').onclick=()=>{$('#apiModal').classList.remove('on');if($('#setModal').classList.contains('on'))openSettings();render()};
function syncField(el){
  const k=el.dataset.k,card=el.closest('.card');if(!k||!card)return;
  const c=channels.find(x=>x.id===card.dataset.id);if(!c)return;
  if(k==='models'){c.models=el.value.split('\n').map(s=>s.trim()).filter(Boolean);if(sel?.ch===c.id&&!c.models.includes(sel.m))sel=null}
  else if(k==='type'){
    const old=c.type;c.type=el.value;
    if(!c.base||c.base===BASE[old])c.base=BASE[c.type];
    if(!c.models.length&&DEFAULT_MODELS[c.type])c.models=[...DEFAULT_MODELS[c.type]];
    save();openApiModal();return}
  else c[k]=el.value.trim();
  save();render()}
$('#ps').oninput=e=>{if(e.target.tagName!=='SELECT')syncField(e.target)};
$('#ps').onchange=e=>syncField(e.target);
$('#ps').onclick=async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='add'){channels.push({id:uid(),name:'新接口',type:'openai',base:BASE.openai,key:'',models:[]});save();openApiModal();return}
  const c=channels.find(x=>x.id===b.closest('.card').dataset.id);if(!c)return;
  if(a==='del'){if(!confirm('删除「'+c.name+'」？'))return;channels=channels.filter(x=>x!==c);if(sel?.ch===c.id)sel=null;save();openApiModal();return}
  if(a==='fetch'){
    if(!c.key&&c.type!=='openai'){toast('先填 API Key');return}
    if(b.disabled)return;
    b.disabled=true;b.textContent='获取中…';
    try{const ms=await listModels(c);if(!channels.includes(c))return;c.models=ms;if(sel?.ch===c.id&&!c.models.includes(sel.m))sel=null;save();toast('获取到 '+ms.length+' 个模型');const t=document.querySelector('.card[data-id="'+c.id+'"] [data-k=models]');if(t)t.value=ms.join('\n');render()}catch(err){toast(err.message.slice(0,80))}
    b.disabled=false;b.textContent='获取模型列表'}};

render();if(!channels.length)setTimeout(()=>{if(!channels.length){channels.push({id:uid(),name:'我的接口',type:'openai',base:BASE.openai,key:'',models:[]});save();openApiModal()}},300);
</script>
